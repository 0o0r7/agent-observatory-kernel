[project]
name = "agent-observatory-kernel"
version = "0.1.0"
description = "AgentObservatory kernel - verdict engine + autoloop runner (AGPL-3.0-only)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_observatory_kernel"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
