name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: lint + test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked
          else
            uv sync
          fi

      - name: Lint (ruff check + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Build (sdist + wheel)
        run: uv build
      - name: Check for Persian characters in code/docs
        run: |
          if grep -rP '[\x{0600}-\x{06FF}]' src/ docs/ 2>/dev/null; then
            echo "Error: Persian characters found in code or docs. All code and documentation must be in English only."
            exit 1
          fi
